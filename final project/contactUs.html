<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>EXLRT</title>
    <link rel="stylesheet" href="style/index.css">
  </head>
  <body >
    <header>
      <div id="header"></div>
    </header>
    <main id="main" tabindex="-1" class="contact-body">
      <div class="contact">
        <div class="contact__map">
          <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2809.55784533516!2d19.814229876261603!3d45.236511171071136!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x475b1011f164e8f5%3A0xce0549d86382e65c!2sExlrt!5e0!3m2!1ssr!2srs!4v1755173531155!5m2!1ssr!2srs" title="EXLRT office location on Google Maps" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
        <div class="contact__form">
          <h1>Contact Us</h1>
          <form class="contact__form-body" action="#">
            <label for="name" class="visualyHidden">Name</label>
            <input id= "name" name="name" type="text" placeholder="Name">
            <label for="email" class="visualyHidden">Email</label>
            <input id="email" name="email" type="email" placeholder="Email">
            <label for="phone-number" class="visualyHidden">Phone</label>
            <input id="phone-number" name="phone" type="tel" placeholder="Phone">
            <label for="message" class="visualyHidden">Message</label>
            <textarea id="message" name="message" placeholder="Message"></textarea>
            <button type="submit" class="contact__button">Submit</button>
          </form>
        </div>
      </div>
    </main>
    <footer><div id="footer"></div></footer>
    <script src="js/main.js"></script>
  </body>
</html>
